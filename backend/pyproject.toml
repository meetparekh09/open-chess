[project]
name = "open-chess-backend"
version = "0.1.0"
description = "API for the Open Chess practice board"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "chess>=1.11.2",
    "fastapi>=0.162.0",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
